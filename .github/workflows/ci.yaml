name: Test and coverage

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check_go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Go dependencies
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9

      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      
      - name: Install JavaScript dependencies
        run: pnpm install

      - name: Run tests
        run: go test ./... -coverprofile=coverage.out -coverpkg=./...

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

  check_generated_tree:
    runs-on: ubuntu-latest
    # The job reads the repository and stages what it regenerates into a
    # local index. Neither needs a writable token, and no step needs the
    # credentials the checkout would otherwise leave in .git/config.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install JavaScript dependencies
        run: pnpm install

      - name: Build dts_to_esc
        run: go build -o ./bin/dts_to_esc ./tools/dts_to_esc

      # internal/interop/data holds hand-written stubs rather than
      # generated packages, so the tree the check reads is one this job
      # seeds. What that gates is generator idempotence over the pinned
      # lib set. Pointing the check at the committed tree gates that
      # tree against its inputs, and waits on §7 committing one. See
      # #1393.
      - name: Seed a scratch tree
        run: |
          ./bin/dts_to_esc generate --overlay internal/interop/overlay \
            node_modules/typescript/lib tmp/esc-tree
          git add --all -- tmp/esc-tree
          git -c user.email=ci@escalier.invalid -c user.name=CI \
            commit -q -m 'seed the scratch tree'

      - name: Check the tree against its inputs
        run: |
          .github/scripts/check-generated-tree.sh tmp/esc-tree -- \
            ./bin/dts_to_esc generate --overlay internal/interop/overlay \
            node_modules/typescript/lib tmp/esc-tree

  check_ts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install

      - name: Run TypeScript
        run: pnpm typecheck

      - name: Biome check
        run: pnpm check

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Go dependencies
        run: go mod download

      - name: Build lsp-server
        run: make lsp-server-wasm

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run Tests
        run: pnpm coverage

      - name: Playwright E2E tests
        working-directory: playground
        run: pnpm e2e:ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playground/playwright-report/

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: playground/test-results/

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

  build_escalier_wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install dependencies
        run: go mod download

      - name: Build escalier.wasm
        run: make escalier-wasm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: escalier.wasm
          path: ./bin/escalier.wasm

  build_cli:
    runs-on: ubuntu-latest
    needs: build_escalier_wasm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download escalier.wasm artifact
        uses: actions/download-artifact@v4
        with:
          name: escalier.wasm
          path: ./bin

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install root dependencies
        run: pnpm install

      - name: Build
        working-directory: ./packages/cli
        run: pnpm build
 
  build_runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install root dependencies
        run: pnpm install

      - name: Build
        working-directory: ./packages/runtime
        run: pnpm build
 
      - name: Run Tests
        working-directory: ./packages/runtime
        run: pnpm test
