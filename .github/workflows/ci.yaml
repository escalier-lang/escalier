name: Test and coverage

on:
  pull_request:
  push:
    branches:
      - main

# Jobs only read the repository. A job that writes, such as
# classify_fixture_deltas, asks for more in its own permissions block.
permissions:
  contents: read

jobs:
  check_go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Go dependencies
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.9

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false
      
      - name: Install JavaScript dependencies
        run: pnpm install

      - name: Run tests
        run: go test ./... -coverprofile=coverage.out -coverpkg=./...

      - name: Upload results to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          flags: go
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

  check_generated_tree:
    runs-on: ubuntu-latest
    # The job reads the repository and stages what it regenerates into a
    # local index. Neither needs a writable token, and no step needs the
    # credentials the checkout would otherwise leave in .git/config.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Install JavaScript dependencies
        run: pnpm install

      - name: Build dts_to_esc
        run: go build -o ./bin/dts_to_esc ./tools/dts_to_esc

      # The check regenerates internal/interop/data in place and diffs
      # the result against what the checkout carries. A hand-edited
      # generated file, a TypeScript pin bump with no regenerated tree,
      # and a converter change nobody re-ran all fail here.
      - name: Check the tree against its inputs
        run: |
          .github/scripts/check-generated-tree.sh internal/interop/data -- \
            ./bin/dts_to_esc generate --overlay internal/interop/overlay \
            node_modules/typescript/lib internal/interop/data

  # Checks the workspace's npm packages before changesets publishes them.
  # `changeset publish` publishes every workspace package that isn't
  # private, so the job fails when a package outside the publish list in
  # check-private-packages.mjs lacks "private": true. It also fails when
  # the committed packages under packages/platforms, or the
  # optionalDependencies of packages/cli/package.json, differ from what
  # tools/gen-platform-packages.mjs writes from tools/platforms.mjs.
  check_npm_packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # setup-node's pnpm cache needs pnpm on PATH before this step runs.
      # The job installs no dependencies, so it turns the cache off.
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      # `pnpm ls` reads the workspace manifests, so the job needs pnpm on
      # PATH but no installed dependencies.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Test the scripts
        run: |
          node --test .github/scripts/check-private-packages.test.mjs \
            tools/gen-platform-packages.test.mjs \
            tools/build-binaries.test.mjs \
            tools/copy-stdlib.test.mjs

      - name: Check that unpublished packages are private
        run: node .github/scripts/check-private-packages.mjs

      # `git status --porcelain` lists modified, deleted and untracked
      # files, so a package the generator adds or removes also fails.
      - name: Check the platform packages against the target list
        run: |
          node tools/gen-platform-packages.mjs
          changes=$(git status --porcelain -- packages/platforms packages/cli/package.json)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "Run node tools/gen-platform-packages.mjs and commit the result."
            exit 1
          fi

  # Fails a PR that changes a published package, or the compiler that
  # @escalier/cli ships, without a changeset that releases it. Without one,
  # the change ships in the next release with no version bump or changelog
  # entry. `pnpm changeset --empty` opts a PR out.
  check_changesets:
    # The "Version Packages" PR that changesets/action opens consumes the
    # changesets, so it changes package versions with none left to find. It
    # comes from this repository, so a fork's branch with the same name
    # still runs the check.
    if: >-
      github.event_name == 'pull_request' &&
      !(github.head_ref == 'changeset-release/main' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      # `changeset status --since` diffs against the base branch, which
      # needs the full history.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the check
        run: node --test .github/scripts/check-changesets.test.mjs

      # The base ref reaches the shell through the environment, so a branch
      # name that contains shell syntax is passed as data and never runs.
      - name: Check changesets for changed packages
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node .github/scripts/check-changesets.mjs "origin/${BASE_REF}"

  # Rates each change to the committed fixture outputs by review risk and
  # posts the report as a PR comment, which later runs edit in place. The
  # fixture tests in check_go confirm the committed outputs match the
  # compiler, so this job reads them straight from git without building
  # anything. The tiers are advisory, so the job fails only when the
  # classifier itself breaks.
  classify_fixture_deltas:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Writing the comment needs pull-requests: write. A PR from a fork
    # gets a read-only token whatever the job asks for.
    permissions:
      contents: read
      pull-requests: write
    # Two runs on one PR could each see no comment and both post one, so a
    # newer push cancels the run already in flight.
    concurrency:
      group: classify-fixture-deltas-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # setup-node caches the pnpm store by default when package.json names
      # a packageManager, which needs pnpm on PATH. This job runs Node
      # scripts with no dependencies, so it skips pnpm and the cache.
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test the classifier
        run: node --test .github/scripts/classify-fixture-deltas.test.mjs

      # The base ref reaches the shell through the environment, so a branch
      # name that contains shell syntax is passed as data and never runs.
      - name: Classify fixture deltas
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          node .github/scripts/classify-fixture-deltas.mjs \
            "origin/${BASE_REF}" --json fixture-deltas.json \
            --comment fixture-deltas.md

      # The step edits the comment an earlier run posted. It posts a new
      # one only when fixtures changed, so a PR that never touches a
      # fixture gets no comment. The token on a fork's PR cannot write, so
      # the step skips those PRs.
      - name: Post the classification to the PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          existing=$(gh api --paginate "repos/${REPO}/issues/${PR}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]")
                      | select(.body | startswith("<!-- classify-fixture-deltas -->"))
                      | .id' | sed -n 1p)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${existing}" \
              -F body=@fixture-deltas.md > /dev/null
          elif [ "$(jq '.results | length' fixture-deltas.json)" -gt 0 ]; then
            gh api -X POST "repos/${REPO}/issues/${PR}/comments" \
              -F body=@fixture-deltas.md > /dev/null
          fi

      - name: Upload the classification
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: fixture-deltas
          path: fixture-deltas.json

  check_ts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install

      - name: Run TypeScript
        run: pnpm typecheck

      - name: Format and lint check
        run: pnpm check

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Go dependencies
        run: go mod download

      - name: Build lsp-server
        run: make lsp-server-wasm

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run Tests
        run: pnpm coverage

      - name: Playwright E2E tests
        working-directory: playground
        run: pnpm e2e:ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report
          path: playground/playwright-report/

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-test-results
          path: playground/test-results/

      - name: Upload results to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          flags: ts
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

  build_escalier_wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install dependencies
        run: go mod download

      - name: Build escalier.wasm
        run: make escalier-wasm

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: escalier.wasm
          path: ./bin/escalier.wasm

  build_cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'

      - name: Install root dependencies
        run: pnpm install

      - name: Build
        working-directory: ./packages/cli
        run: pnpm build

      - name: Run Tests
        working-directory: ./packages/cli
        run: pnpm test

      # publint checks the package.json fields and the packed file list.
      # attw resolves the types for ESM consumers, the only kind this
      # ESM-only package supports.
      - name: Check the published package
        working-directory: ./packages/cli
        run: pnpm lint:package

  # Decides whether e2e_cli runs on a pull request. A workflow-level
  # `paths` filter would skip every job, so this job diffs the PR against
  # its base instead. It lists the files that change what @escalier/cli
  # packs or how the binary finds the stdlib.
  e2e_cli_changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The base ref reaches the shell through the environment, so a branch
      # name that contains shell syntax is passed as data and never runs.
      - name: Check for changes to the packed CLI
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --quiet "origin/${BASE_REF}...HEAD" -- \
            packages/cli packages/platforms internal/stdlibdir \
            fixtures/npm_e2e fixtures/npm_e2e_type_error \
            tools/build-binaries.mjs tools/copy-stdlib.mjs \
            tools/e2e-cli.mjs tools/platforms.mjs .github/workflows/ci.yaml
          then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # Installs @escalier/cli and @escalier/cli-linux-x64 from packed tarballs
  # into a project outside the checkout, then builds the project with
  # ESCALIER_STDLIB_DIR unset. Inside the checkout the binary finds the
  # stdlib by walking up to internal/interop/data, so only an install
  # elsewhere catches a package that leaves out a file the binary reads.
  # It runs on every push to main, and on a pull request when
  # e2e_cli_changes finds a change to the packed CLI.
  e2e_cli:
    needs: e2e_cli_changes
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' ||
        needs.e2e_cli_changes.outputs.run == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # The script builds the linux-x64 binary with tools/build-binaries.mjs,
      # packs both packages and installs the tarballs with npm.
      - name: Install the packed CLI and build a project with it
        run: node tools/e2e-cli.mjs

  build_runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
      
      - name: Install root dependencies
        run: pnpm install

      - name: Build
        working-directory: ./packages/runtime
        run: pnpm build

      # publint checks the package.json fields and the packed file list.
      # attw resolves the types for both the import and require conditions.
      - name: Check the published package
        working-directory: ./packages/runtime
        run: pnpm lint:package
 
      - name: Run Tests
        working-directory: ./packages/runtime
        run: pnpm test
